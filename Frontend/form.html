<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./iconos/tab_logo.png">
    <title>Crear usuario | Bit-els</title>

<!-- Bulma -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<!-- CSS propio -->
<link rel="stylesheet" href="./style.css">

  </head>

  <body class="user-page">

<!-- Formulario crear usuario -->
<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-half">

        <div class="box">
          <h2 class="title is-3 has-text-centered">Crear usuario</h2>

          <form id="create-user-form">

            <!-- Nickname -->
            <div class="field">
              <label class="label">Nombre de usuario</label>
              <div class="control">
                <input class="input" type="text" name="nickname" required>
              </div>
            </div>

            <!-- Nombre completo -->
            <div class="field">
              <label class="label">Nombre completo</label>
              <div class="control">
                <input class="input" type="text" name="name" placeholder="(opcional)">
              </div>
            </div>

            <!-- Email -->
            <div class="field">
              <label class="label">Email</label>
              <div class="control">
                <input class="input" type="email" name="email" required>
              </div>
            </div>

            <!-- Contraseña -->
            <div class="field">
              <label class="label">Contraseña</label>
              <div class="control">
                <input class="input" type="password" name="password" required>
              </div>
            </div>

            <!-- Teléfono -->
            <div class="field">
              <label class="label">Teléfono</label>
              <div class="control">
                <input class="input" type="tel" name="phone" placeholder="(opcional)">
              </div>
            </div>

            <!-- Ubicación -->
            <div class="field">
              <label class="label">Ubicación</label>
              <div class="control">
                <input class="input" type="text" name="location" placeholder="(opcional)">
              </div>
            </div>

            <!-- Instrumento -->
            <div class="field">
              <label class="label">Instrumento</label>
              <div class="control">
                <input class="input" type="text" name="instruments" placeholder="(opcional)">
              </div>
            </div>

            <!-- Género musical favorito -->
            <div class="field">
              <label class="label">Género musical favorito</label>
              <div class="control">
                <input class="input" type="text" name="genres" placeholder="(opcional)">
              </div>
            </div>

            <!-- Fecha nacimiento -->
            <div class="field">
              <label class="label">Fecha de nacimiento</label>
              <div class="control">
                <input class="input" type="date" name="birth" placeholder="(opcional)">
              </div>
            </div>

            <!-- Género -->
            <div class="field">
              <label class="label">Género</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="gender"> 
                    <option value="">Seleccionar (opcional)</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="O">Otro</option>
                  </select> 
                </div>
              </div>
            </div>

            <!-- Botón -->
            <div class="field mt-5">
              <div class="control has-text-centered">
                <button class="button is-primary is-medium" type="submit">
                  Crear usuario
                </button>
              </div>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>
</section>
