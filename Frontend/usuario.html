<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tab_logo -->
    <link rel="icon" type="image/png" href="./iconos/tab_logo.png">
    <!-- Tab_nombre -->
    <title>Usuario | Bit-els</title>
    <!-- import bulma.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- import nuestro css -->
    <link rel="stylesheet" href="./style.css">
  </head>

  <!-- SOLO ESTE BODY, nada más -->
  <body class="user-page">

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="./index.html">
          <h1><strong>BIT-ELS</strong></h1>
          <img src="./iconos/logo.png" alt="Logo del sitio web (notas musicales)">
        </a>
      </div>

      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            <a class="button is-primary">
              <strong>Log out</strong>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sección de Usuario -->
    <section class="section">
      <div class="container">

        <!-- Usuario -->
        <div class="box has-text-centered">
          <h2 class="title is-3 mt-3" id="username"></h2>
          <figure class="image is-128x128 is-inline-block">
            <img class="is-rounded" id="avatar" src="" alt="Foto de perfil del usuario">
          </figure>
          <p id="description"></p>
        </div>

        <!-- Información adicional -->
        <div class="box mt-5">
          <h4 class="title is-5">Información adicional</h4>
          <p><strong>Nombre:</strong> <span id="name"></span></p>
          <p><strong>Mail:</strong> <span id="email"></span></p>
          <p><strong>Teléfono:</strong> <span id="phone"></span></p>
          <p><strong>Ubicación:</strong> <span id="location"></span></p>
          <p><strong>Instrumento:</strong> <span id="instruments"></span></p>
          <p><strong>Género preferido:</strong> <span id="genres"></span></p>
        </div>

        <!-- Tarjetas de partituras -->
        <h3 class="title is-4 mt-6">Partituras subidas</h3>

        <div class="columns is-multiline">
          <!-- Tarjeta 1 -->
          <div class="column is-one-quarter">
            <div class="card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./iconos/partitura1.png" alt="Vista previa de la partitura">
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">“Titulo de la partitura”</p>
                <p class="subtitle is-6">"instrumento/s"</p>
              </div>
              <footer class="card-footer">
                <a href="#" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>

          <!-- Tarjeta 2 -->
          <div class="column is-one-quarter">
            <div class="card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./iconos/partitura2.png" alt="Vista previa de la partitura">
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">“Titulo de la partitura”</p>
                <p class="subtitle is-6">"instrumento/s"</p>
              </div>
              <footer class="card-footer">
                <a href="#" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>

          <!-- Tarjeta 3 -->
          <div class="column is-one-quarter">
            <div class="card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./iconos/partitura3.png" alt="Vista previa de la partitura">
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">“Titulo de la partitura”</p>
                <p class="subtitle is-6">"instrumento/s"</p>
              </div>
              <footer class="card-footer">
                <a href="#" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>

          <!-- Botón para subir nueva partitura -->
          <div class="column is-one-quarter">
            <div class="card has-text-centered p-6">
              <a class="button is-success is-medium">
                <strong>+ Subir nueva partitura</strong>
              </a>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Script JS -->
    <script type="module" src="js/usuario.js"></script>

  </body>
</html>
