<!DOCTYPE html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tab_nombre -->

    <!-- import bulma.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- import nuestro css -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <!-- Link a Home -->
      <a class="navbar-item" href="./index.html">
        <!-- Navbar Título -->
        <h1><strong>BIT-ELS</strong></h1>
        <!-- Navbar logo -->
        <img src="./iconos/logo.png"
        alt="Logo del sitio web (notas musicales)">
      </a>

      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navbarBasicExample" class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item">
          Home
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <!--bloque central navbar-->
      <div id="navbarBasicExample" class="navbar-menu">
        
        
        <div class="navbar-start is-flex is-justify-content-center is-align-items-center" style="width: 100%;">
          
          <!--cantidad posts-->
          <div class="level-item">
            <p class="subtitle is-5"><strong>123</strong> partituras</p>
          </div>

          <!--barra de busqueda-->
          <div class="level-item">
            <div class="field has-addons">
              <p class="control">
                <input class="input" type="text" placeholder="Find a post" />
              </p>
              <p class="control">
                <button class="button">Search</button>
              </p>
            </div>
          </div>
        </div>


        <!-- Sign up / Log in -->
        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary">
                <strong>Sign up</strong>
              </a>
              <a class="button is-light">
                Log in
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>
      <!-- LISTA DE PARTITURAS RECIENTES -->

      <div class="container">
        <div class="level mb-5">
          <div class="level-left">
            <h2 class="title is-3">Partituras recientes</h2>

          <div class="level-right">
            <a class="button is-small is-link is-light">Ver todas</a>

        <div class="columns is-multiline">

          <div class="column is-one-quarter">
            <div class="card post-card">

                  <img src="./media/imagenes/queen.jpg" alt="portada cancion" />

                <p class="title is-5">Don't Stop Me Now</p>
                <p class="subtitle is-6">Piano - Queen</p>

                <a href="partitura.html" class="card-footer-item">Ver</a>
              </footer>
              </div>
            </div>
          
            <!-- Tarjeta 2 -->

                <figure class="image is-4by3">

              </div>
              <div class="card-content">
                <p class="title is-5">Imagine</p>
                <p class="subtitle is-6">Piano - John Lennon</p>
              </div>
              <footer class="card-footer">
                <a href="partitura.html" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>

          <div class="column is-one-quarter">
            <div class="card post-card">

                <figure class="image is-4by3">

              </div>
              <div class="card-content">
                <p class="title is-5">Bohemian Rhapsody</p>
                <p class="subtitle is-6">Piano - Queen</p>

              <footer class="card-footer">

              </footer>
            </div>
          </div>

          <div class="column is-one-quarter">
            <div class="card post-card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./media/imagenes/beatles.jpg" alt="portada cancion" />

                <p class="title is-5">Let It Be</p>
