<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tab_logo -->
    <link rel="icon" type="image/png" href="./iconos/tab_logo.png">
    <!-- Tab_nombre -->
    <title>Home | Bit-els</title>
    <!-- import bulma.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- import nuestro css -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <!-- Link a Home -->
        <a class="navbar-item" href="./index.html">
          <!-- Navbar Título -->
          <h1><strong>BIT-ELS</strong></h1>
          <!-- Navbar logo -->
          <img src="./iconos/logo.png"
          alt="Logo del sitio web (notas musicales)">
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="menuNavbar">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <!--bloque central navbar-->
      <div id="menuNavbar" class="navbar-menu">
        <div class="navbar-item has-dropdown" id="navbarBusqueda" style="justify-content:center; align-items:center;">
          <div class="navbar-link" style="padding:0; background:none;">
            <div class="field has-addons" style="width:500px; margin:0;">
              <div class="control is-expanded">
                <input
                  id="navbarInput"
                  class="input"
                  type="text"
                  placeholder="Buscar..."
                >
              </div>
              <div class="control">
                <button id="navbarBotonBusqueda" class="button is-primary">
                  Buscar
                </button>
              </div>
            </div>
          </div>

          <div class="navbar-dropdown" id="navbarDropdown"></div>
        </div>


      

        <!-- Sign up / Log in -->
        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary">
                <strong>Sign up</strong>
              </a>
              <a class="button is-light">
                Log in
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- PARTITURAS POPULARES -->
    <section class="section">
      <div class="container">
        <h2 class="title is-3">Partituras populares ⭐</h2>
        <p class="subtitle is-6">Mejor valoradas por la comunidad</p>

        <div id="populares" class="columns is-multiline"></div>
      </div>
    </section>

    <!-- PARTITURAS RECIENTES -->
    <section class="section">
      <div class="container">
        <h2 class="title is-3">Partituras recientes</h2>
        <p class="subtitle is-6">Explorá las últimas partituras</p>

        <div id="recientes" class="columns is-multiline"></div>
      </div>
    </section>

    <script type="module" src="./js/index.js"></script>
    <script type="module" src="./js/navbar.js"></script>
  </body>
</html>
