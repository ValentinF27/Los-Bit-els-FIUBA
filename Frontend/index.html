<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tab_logo -->
    <link rel="icon" type="image/png" href="./iconos/tab_logo.png">
    <!-- Tab_nombre -->
    <title>Home | Bit-els</title>
    <!-- import bulma.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- import nuestro css -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <!-- Link a Home -->
        <a class="navbar-item" href="./index.html">
          <!-- Navbar Título -->
          <h1><strong>BIT-ELS</strong></h1>
          <!-- Navbar logo -->
          <img src="./iconos/logo.png"
          alt="Logo del sitio web (notas musicales)">
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="menuNavbar">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <!--bloque central navbar-->
      <div id="menuNavbar" class="navbar-menu">
        <div class="navbar-item has-dropdown" id="navbarBusqueda" style="justify-content:center; align-items:center;">
          <div class="navbar-link" style="padding:0; background:none;">
            <div class="field has-addons" style="width:500px; margin:0;">
              <div class="control is-expanded">
                <input
                  id="navbarInput"
                  class="input"
                  type="text"
                  placeholder="Buscar..."
                >
              </div>
              <div class="control">
                <button id="navbarBotonBusqueda" class="button is-primary">
                  Buscar
                </button>
              </div>
            </div>
          </div>

          <div class="navbar-dropdown" id="navbarDropdown"></div>
        </div>


      

        <!-- Sign up / Log in -->
        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary">
                <strong>Sign up</strong>
              </a>
              <a class="button is-light">
                Log in
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>


      <!-- LISTA DE PARTITURAS RECIENTES -->
    <div class="section">
      <div class="container">
        <div class="level mb-5">
          <div class="level-left">
            <h2 class="title is-3">Partituras recientes</h2>
          </div>
          <div class="level-right">
            <a class="button is-small is-link is-light">Ver todas</a>
          </div>
        </div>

        <p class="subtitle is-6">Explorá las ultimas partituras de la web</p>

          
        <div class="columns is-multiline">
          <!-- Tarjeta 1 -->
          <div class="column is-one-quarter">
            <div class="card post-card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./media/imagenes/queen.jpg" alt="portada cancion" />
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">Don't Stop Me Now</p>
                <p class="subtitle is-6">Piano - Queen</p>
              </div>
              <footer class="card-footer">
                <a href="partitura.html" class="card-footer-item">Ver</a>
              </footer>
              </div>
            </div>
          
            <!-- Tarjeta 2 -->
          <div class="column is-one-quarter">
            <div class="card post-card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./media/imagenes/john_lennon.jpg" alt="portada cancion" />
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">Imagine</p>
                <p class="subtitle is-6">Piano - John Lennon</p>
              </div>
              <footer class="card-footer">
                <a href="partitura.html" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>


          <!-- Tarjeta 3 -->
          <div class="column is-one-quarter">
            <div class="card post-card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./media/imagenes/queen.jpg" alt="portada cancion" />
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">Bohemian Rhapsody</p>
                <p class="subtitle is-6">Piano - Queen</p>
              </div>
              <footer class="card-footer">
                <a href="partitura.html" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>


            <!-- Tarjeta 4 -->
          <div class="column is-one-quarter">
            <div class="card post-card">
              <div class="card-image">
                <figure class="image is-4by3">
                  <img src="./media/imagenes/beatles.jpg" alt="portada cancion" />
                </figure>
              </div>
              <div class="card-content">
                <p class="title is-5">Let It Be</p>
                <p class="subtitle is-6">Piano - Beatles</p>
              </div>
              <footer class="card-footer">
                <a href="partitura.html" class="card-footer-item">Ver</a>
              </footer>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/navbar.js"></script>
  </body>
</html>
