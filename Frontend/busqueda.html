<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tab_logo -->
    <link rel="icon" type="image/png" href="./Imagenes/tab_logo.png">
    <!-- Tab_nombre -->
    <title>Home | Bit-els</title>
    <!-- import bulma.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- import nuestro css -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <!-- Link a Home -->
        <a class="navbar-item" href="./index.html">
          <!-- Navbar Título -->
          <h1><strong>BIT-ELS</strong></h1>
          <!-- Navbar logo -->
          <img src="./Imagenes/logo.png"
          alt="Logo del sitio web (notas musicales)">
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="menuNavbar">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <!--bloque central navbar-->
      <div id="menuNavbar" class="navbar-menu">
        
        <!-- Sign up / Log in -->
        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary">
                <strong>Sign up</strong>
              </a>
              <a class="button is-light">
                Log in
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">

        <!-- Título -->
        <h1 class="title is-2">Buscar partituras</h1>
        <p class="subtitle is-5">Encontrá tus partituras por nombre, artista o categoría.</p>

        <!-- Barra de búsqueda -->
        <div class="field has-addons mb-5">
          <div class="control is-expanded">
            <input class="input" type="text">
          </div>
          <div class="control">
            <button id="botonBusqueda" class="button is-primary">Buscar</button>
          </div>
        </div>
      </div>
      <br>
      <br>
      <!-- Resultados de búsqueda -->
      <div class="container">
        <h2 class="title is-2">Resultados de búsqueda</h2>

        <div id="resultadosBusqueda" class="box mt-5">

          <!-- Resultado 1 -->
          <article class="media mb-4">
            <figure class="media-left">
              <p class="image is-64x64">
                <img src="./Imagenes/Dont_Stop_Me_Now-Queen.png" alt="Don't Stop Me Now">
              </p>
            </figure>

            <div class="media-content">
              <p>
                <strong>Don't Stop Me Now</strong><br>
                <small>Piano - Queen</small>
              </p>
            </div>

            <div class="media-right">
              <a href="partitura.html" class="button is-small is-primary">Ver</a>
            </div>
          </article>


          <!-- Resultado 2 -->
          <article class="media mb-4">
            <figure class="media-left">
              <p class="image is-64x64">
                <img src="./Imagenes/Imagine-John_Lennon.png" alt="Imagine">
              </p>
            </figure>

            <div class="media-content">
              <p>
                <strong>Imagine</strong><br>
                <small>Piano - John Lennon</small>
              </p>
            </div>

            <div class="media-right">
              <a href="partitura.html" class="button is-small is-primary">Ver</a>
            </div>
          </article>


          <!-- Resultado 3 -->
          <article class="media mb-4">
            <figure class="media-left">
              <p class="image is-64x64">
                <img src="./Imagenes/Queen-Bohemiam_Rhapsody.png" alt="Bohemian Rhapsody">
              </p>
            </figure>

            <div class="media-content">
              <p>
                <strong>Bohemian Rhapsody</strong><br>
                <small>Piano - Queen</small>
              </p>
            </div>

            <div class="media-right">
              <a href="partitura.html" class="button is-small is-primary">Ver</a>
            </div>
          </article>


          <!-- Resultado 4 -->
          <article class="media mb-4">
            <figure class="media-left">
              <p class="image is-64x64">
                <img src="./Imagenes/Let_it_be-Beatles.png" alt="Let It Be">
              </p>
            </figure>

            <div class="media-content">
              <p>
                <strong>Let It Be</strong><br>
                <small>Piano - Beatles</small>
              </p>
            </div>

            <div class="media-right">
              <a href="partitura.html" class="button is-small is-primary">Ver</a>
            </div>
          </article>

        </div>
      </div>
    </section>
    
    <script src="./navbar.js"></script>
  </body>
</html>
