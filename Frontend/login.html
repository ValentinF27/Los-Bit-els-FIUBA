<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tab_logo -->
    <link rel="icon" type="image/png" href="./iconos/tab_logo.png">
    <!-- Tab_nombre -->
    <title>Login | Bit-els</title>
    <!-- import bulma.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- import nuestro css -->
    <link rel="stylesheet" href="./style.css">
  </head>
    <body class="login-page">

      <section class="section">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-4-desktop is-6-tablet">

              <div class="box has-text-centered login-box">
                <h1 class="title is-3">BIT-ELS</h1>
                <h2 class="subtitle is-5">Inicia sesión</h2>

                <!-- Formulario -->
                <form id="login-form">
                  <div class="field">
                    <div class="control">
                      <input class="input" type="text" id="nickname" placeholder="Nickname" required>
                    </div>
                  </div>

                  <div class="field">
                    <div class="control">
                      <input class="input" type="password" id="password" placeholder="Contraseña" required>
                    </div>
                  </div>

                  <div class="field mt-5">
                    <div class="control">
                      <button class="button is-primary is-fullwidth">Ingresar</button>
                    </div>
                  </div>
                </form>

              </div>

            </div>
          </div>
        </div>
      </section>

      <!-- Script de login -->
      <script type="module">
        import { login } from './js/login.js';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
          e.preventDefault();

          const nickname = document.getElementById('nickname').value;
          const password = document.getElementById('password').value;

          await login(nickname, password);
        });
      </script>

    </body>
</html>
