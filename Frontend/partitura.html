<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./Imagenes/tab_logo.png">
    <title>Partitura | Bit-els</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="./style.css">
  </head>

  <body>
    <section class="section">
      <div class="container">

        <!-- Información de la partitura -->
        <div class="box">
          <div class="columns is-vcentered">
            <!-- Imagen -->
            <div class="column is-one-third">
              <figure class="image is-3by4">
                <img src="./Imagenes/partitura1.png" alt="Vista previa de la partitura">
              </figure>
            </div>

            <!-- Detalles -->
            <div class="column">
              <h1 class="title is-3">Título de la Partitura</h1>
              <h2 class="subtitle is-5">Por <strong>Oscar Perez</strong></h2>
              <p><strong>Instrumentos:</strong> Piano, Violín</p>
              <p><strong>Nivel:</strong> Intermedio</p>
              <p><strong>Duración:</strong> 3:45 min</p>
              <p class="mt-3">
                <strong>Descripción:</strong>  
                Esta pieza combina elementos clásicos con un toque moderno. Ideal para recitales o práctica individual.
              </p>

              <div class="buttons mt-5">
                <a class="button is-primary">Descargar PDF</a>
                <a class="button is-link is-light">Editar</a>
                <a class="button is-danger is-light">Eliminar</a>
              </div>
            </div>
          </div>
        </div>

        <!-- PDF embebido -->
        <div class="box">
          <h3 class="title is-4">Vista de la partitura</h3>
          <object data="./PDFs/partitura1.pdf" type="application/pdf" width="100%" height="600px">
            <p>Tu navegador no puede mostrar el PDF. 
              <a href="./PDFs/partitura1.pdf" target="_blank">Descargar aquí</a>.
            </p>
          </object>
        </div>
        
    </section>
  </body>
</html>
